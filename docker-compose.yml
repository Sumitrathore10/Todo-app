services:
  client:
    build: ./client
    expose:
      - "5173"
    networks:
      - mern

  server:
    build: ./server
    expose:
      - "8000"
    env_file:
      - ./server/.env
    networks:
      - mern

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    networks:
      - mern
