services:

  client:
    image: "132005/client:latest"
    expose:
      - "5173"
    ports:
      - "80"
    networks:
      - mern

  server:
    image: "132005/server:latest"
    expose:
      - "8000"
    env_file:
      - ./server/.env
    networks:
      - mern

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./client/nginx.config:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    networks:
      - mern

networks :
  mern :
    driver : bridge
